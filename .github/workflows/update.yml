name: Refresh, test, build and deploy

# Runs on every push to main, every 6 hours (new polls), and on the manual button.
# Scheduled runs first pull the latest Wikipedia poll pages for the current cycle,
# commit them, then rebuild the forecast. If anything fails, nothing is committed
# and the site keeps the last good forecast.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch the current cycle's Wikipedia pages
        run: python -m pipeline.fetch_wikipedia fetch --cycle 2026

      - name: Add any new pollster names (marked as new; listed in the run log)
        run: python tools/add_wikipedia_aliases.py --create-rest

      - name: Parse polls
        run: python -m pipeline.load_wikipedia --cycle 2026

      - name: Commit new data
        run: |
          git config user.name "poll-compiler bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/2026 data/polls/2026.csv config/pollster_aliases.yaml reports/parse_notes_2026.txt
          if git diff --cached --quiet; then echo "No new polls"; exit 0; fi
          git commit -m "Poll refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

  test-and-build:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run election-night parser tests
        run: npm install --no-audit --no-fund && npm test

      - name: Run pipeline
        run: python -m pipeline.run_all

      - name: Stamp asset versions (so phones never keep an old app.js)
        run: sed -i "s/__BUILD__/$(git rev-parse --short HEAD)-${GITHUB_RUN_NUMBER}/g" site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
