name: Fetch wikitext test fixtures

on:
  workflow_dispatch:
    inputs:
      titles:
        description: "Page titles, one per line"
        required: true

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        env:
          TITLES: ${{ inputs.titles }}
        run: |
          mapfile -t T <<< "$TITLES"
          python -m pipeline.fetch_wikitext "${T[@]}"
      - name: Commit
        run: |
          git config user.name "poll-compiler bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/wikitext
          git diff --cached --quiet && exit 0
          git commit -m "Wikitext test fixtures"
          git push
