name: Fetch Wikipedia pages

# Manual for now (Phase 3). Discovers and downloads the poll pages for the
# given cycles, then commits config/sources/ and data/raw/ back to main.
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: "Cycles, space separated"
        default: "2024 2026"
        required: true
      discover:
        description: "Re-run page discovery first"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Discover pages
        if: ${{ inputs.discover }}
        run: |
          args=""; for c in ${{ inputs.cycles }}; do args="$args --cycle $c"; done
          python -m pipeline.fetch_wikipedia discover $args

      - name: Fetch pages
        run: |
          args=""; for c in ${{ inputs.cycles }}; do args="$args --cycle $c"; done
          python -m pipeline.fetch_wikipedia fetch $args

      - name: Commit snapshots
        run: |
          git config user.name "poll-compiler bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources data/raw
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fetch Wikipedia snapshots: ${{ inputs.cycles }}"
          git push
