<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>poll-compiler</title>
<meta name="description" content="2026 Senate and House odds compiled from public polls, with every pollster graded on its track record.">
<meta name="theme-color" content="#0f1526">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=__BUILD__">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">poll-compiler</div>
    <div class="updated" id="updated"></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-senate" aria-selected="true">Senate</button>
    <button role="tab" id="tab-house" aria-selected="false">House</button>
  </div>

  <div class="livebar" id="livebar" hidden></div>

  <section aria-label="Chance of control">
    <div class="board">
      <div class="side d"><div class="pct" id="pd">–</div><div class="who" id="wd">Democrats</div></div>
      <div class="mid" id="mid"></div>
      <div class="side r"><div class="pct" id="pr">–</div><div class="who" id="wr">Republicans</div></div>
    </div>
    <div class="bar" id="bar" role="img"></div>
    <div class="bar-legend"><span id="bl"></span><span id="bm"></span><span id="br"></span></div>
    <div class="extra" id="extra"></div>
  </section>

  <div class="map" id="map" aria-label="Map of races"></div>
  <div class="key" id="key"></div>

  <h2 id="list-title">Races, closest first</h2>
  <ul class="races" id="races"></ul>

  <footer>
    Odds from public polls compiled from Wikipedia (CC BY-SA) and archived FiveThirtyEight data (CC BY 4.0),
    each poll weighted by recency, sample, voter screen and the pollster's record, blended with partisan lean.
    <span id="status"></span>
  </footer>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <header><h3 id="sheet-title"></h3><button class="close" id="close">Close</button></header>
  <div id="sheet-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="live.js?v=__BUILD__"></script>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
