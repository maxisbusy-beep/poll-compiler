# Max's ballot: Hillsborough County, FL, ballot style 33400A (ZIP 33610), November 3, 2026.
# Read by pipeline/my_ballot.py, which writes site/data/my_ballot.json for the "My ballot" tab.
#
# kind:
#   model  - race the main model already forecasts (ref = its race_id); odds and live results come from there
#   polls  - statewide race outside the model; polls below go through the governor model's average
#            (same weights, same pollster bias correction, same error formula). Not backtested.
#   local  - county race: no public polls, no odds; live counts are only on the county's own site
#   measure - county referendum: yes/no, live counts only on the county's site
#
# Poll margins are side_a (D) minus side_b (R). Only likely-voter numbers are entered where a
# poll reported both LV and RV. Polls from Wikipedia's race pages (CC BY-SA), entered Nov 3, 2026.

